[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Tomas"]

[workspace.dependencies]
tidy-scan = { path = "crates/tidy-scan" }
tidy-ops = { path = "crates/tidy-ops" }
tidy-plan = { path = "crates/tidy-plan" }
tidy-rules = { path = "crates/tidy-rules" }
tidy-judge = { path = "crates/tidy-judge" }

anyhow = "1"
thiserror = "2"
libc = "0.2"
rayon = "1.12"
parking_lot = "0.12"
rustc-hash = "2"
bytemuck = { version = "1.25", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env"] }
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
zstd = "0.13"
toml = "0.9"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Fast iteration builds that still optimise the hot crates.
[profile.dev.package."*"]
opt-level = 2
